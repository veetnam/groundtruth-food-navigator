<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GroundTruth — Household Food Navigator</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #ffffff;
  --border: #d9d2c2;
  --accent: #5b6b3a;
  --accent-dark: #3f4a28;
  --accent-light: #eef1e6;
  --text: #252520;
  --muted: #5c5748;
  --warn: #a4522a;
  --warn-light: #f5e6de;
  --row-alt: #f5f2ea;
  --font-scale: 1;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1b17; --card: #262420; --border: #46423a; --accent: #8ba35f;
    --accent-dark: #a9c17f; --accent-light: #33361f; --text: #ede8dc;
    --muted: #b8b0a0; --warn: #d98a5f; --warn-light: #3d2a20; --row-alt: #29271f;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1b17; --card: #262420; --border: #46423a; --accent: #8ba35f;
  --accent-dark: #a9c17f; --accent-light: #33361f; --text: #ede8dc;
  --muted: #b8b0a0; --warn: #d98a5f; --warn-light: #3d2a20; --row-alt: #29271f;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: Helvetica, Arial, sans-serif;
  font-size: calc(15px * var(--font-scale));
  line-height: 1.5;
}
h1, h2, h3, .serif { font-family: Georgia, "Times New Roman", serif; }
.hidden { display: none !important; }
button { font-family: inherit; font-size: inherit; cursor: pointer; }
a { color: inherit; }

#accent-strip { height: 6px; background: var(--accent); }
#topbar {
  display: flex; justify-content: flex-end; align-items: center; gap: 6px;
  padding: 6px 20px; font-size: calc(13px * var(--font-scale)); color: var(--muted);
}
.ghost-btn {
  background: none; border: none; color: var(--accent-dark); padding: 6px 10px;
  border-radius: 4px; font-weight: 600;
}
.ghost-btn:hover { background: var(--accent-light); }

#shell { display: flex; min-height: calc(100vh - 40px); }
#sidebar {
  width: 190px; flex: 0 0 190px; background: var(--card); border-right: 1px solid var(--border);
  padding: 20px 0; display: flex; flex-direction: column;
}
#sidebar .brand { font-family: Georgia, serif; font-weight: bold; font-size: calc(18px * var(--font-scale));
  padding: 0 18px 20px 18px; }
.nav-item {
  padding: 11px 18px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none;
}
.nav-item:hover { background: var(--accent-light); }
.nav-item.active { background: var(--accent); color: white; }
#sidebar .spacer { flex: 1; }
#reset-household {
  margin: 10px 18px 4px 18px; padding: 8px 0; color: var(--warn); font-size: calc(13px * var(--font-scale));
  font-weight: 600; cursor: pointer; border-top: 1px solid var(--border); padding-top: 14px;
}

#content { flex: 1; min-width: 0; padding: 22px 28px 40px 28px; overflow-x: hidden; }
.page { max-width: 1000px; }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  padding: 20px 22px; margin-bottom: 14px;
}
.card h2 { margin: 0 0 4px 0; font-size: calc(18px * var(--font-scale)); color: var(--accent-dark); }
.muted { color: var(--muted); font-size: calc(13px * var(--font-scale)); }
.small { font-size: calc(12.5px * var(--font-scale)); color: var(--muted); }

.summary-cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.summary-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  padding: 16px 18px; flex: 1 1 200px; min-width: 190px;
}
.summary-card .label { font-weight: 700; font-size: calc(13px * var(--font-scale)); margin-bottom: 6px; }
.summary-card .value { font-size: calc(26px * var(--font-scale)); font-weight: 700; color: var(--accent-dark); }
.summary-card .value.warn { color: var(--warn); }
.summary-card .sub { font-size: calc(12px * var(--font-scale)); color: var(--muted); margin-top: 4px; }

/* Home */
.home-header { position: relative; padding: 10px 0 6px 0; }
.home-header h1 { font-size: calc(30px * var(--font-scale)); margin: 0; }
.bg-blob { position: absolute; border-radius: 50%; z-index: -1; opacity: 0.7; }
#home-wrap { position: relative; }
.status-strip { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 10px 16px; margin: 10px 0 4px 0; font-weight: 700; }
.status-strip.warn { color: var(--warn); }
.tile-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.tile {
  display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; overflow: hidden;
}
.tile:hover { background: var(--accent-light); }
.tile .stripe { width: 6px; flex-shrink: 0; }
.tile .tile-body { padding: 12px 18px; }
.tile .tile-title { font-family: Georgia, serif; font-weight: bold; font-size: calc(16px * var(--font-scale)); }
.tile .tile-desc { color: var(--muted); font-size: calc(13px * var(--font-scale)); margin-top: 2px; }

/* Buttons */
.btn { border: none; border-radius: 4px; padding: 10px 18px; font-weight: 700; }
.btn-accent { background: var(--accent); color: white; }
.btn-accent:hover { background: var(--accent-dark); }
.btn-outline { background: none; border: 1px solid var(--border); color: var(--text); padding: 9px 17px; border-radius: 4px; font-weight: 700; }
.btn-outline:hover { background: var(--accent-light); }
.toggle-btn { background: white; border: 1px solid var(--border); border-radius: 4px; padding: 12px 20px; font-weight: 700; margin-right: 8px; }
.toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

input[type=text], input[type=number] {
  border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: inherit;
  background: var(--card); color: var(--text); width: 140px;
}
label.radio { font-weight: 600; margin-right: 14px; }

/* progress bar */
.progress-track { background: var(--border); border-radius: 6px; height: 8px; width: 300px; max-width: 60vw; overflow: hidden; }
.progress-fill { background: var(--accent); height: 100%; }
.step-label { font-weight: 700; color: var(--accent-dark); margin-bottom: 6px; }

/* agency picker */
.region-head { font-family: Georgia, serif; font-weight: bold; color: var(--accent-dark); margin: 14px 0 4px 0; }
.agency-option { display: block; margin: 3px 0 3px 12px; cursor: pointer; }

/* table */
table.fdpir-table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: calc(13px * var(--font-scale)); }
table.fdpir-table th { background: var(--accent-dark); color: white; padding: 8px; text-align: center; }
table.fdpir-table th:first-child, table.fdpir-table th.left { text-align: left; }
table.fdpir-table td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border); }
table.fdpir-table td.left { text-align: left; }
table.fdpir-table tr:nth-child(odd) td { background: var(--row-alt); }
.table-wrap { overflow-x: auto; }

/* chips */
.chip { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: calc(11px * var(--font-scale));
  font-weight: 700; color: white; margin: 0 4px 4px 0; }
.chip-toggle { background: var(--border); color: var(--text); cursor: pointer; user-select: none; }
.chip-toggle.active-tag { background: var(--accent); color: white; }
.chip-toggle.active-allergen { background: var(--warn); color: white; }

/* recipes grid */
#recipe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); gap: 14px; justify-content: center; margin-top: 12px; }
@media (max-width: 900px) { #recipe-grid { grid-template-columns: repeat(2, minmax(0, 300px)); } }
@media (max-width: 620px) { #recipe-grid { grid-template-columns: minmax(0, 1fr); } }
.recipe-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
.recipe-card .stripe { height: 6px; }
.recipe-card .rc-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; }
.recipe-card h3 { margin: 0 0 4px 0; font-size: calc(15px * var(--font-scale)); font-family: Helvetica, sans-serif; font-weight: 700; }
.recipe-card .rc-desc { color: var(--muted); font-size: calc(13px * var(--font-scale)); margin-bottom: 6px; }
.recipe-card .rc-stats { color: var(--muted); font-size: calc(11.5px * var(--font-scale)); margin-bottom: 8px; }
.recipe-card .rc-missing { color: var(--warn); font-size: calc(11.5px * var(--font-scale)); margin-bottom: 8px; }

/* modal */
#modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
  align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
#modal { background: var(--bg); border-radius: 6px; max-width: 560px; width: 100%; max-height: 86vh;
  overflow-y: auto; padding: 24px; position: relative; }
#modal .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none;
  font-size: calc(20px * var(--font-scale)); color: var(--muted); cursor: pointer; }

/* locator */
.site-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; }
.gas-box { background: var(--accent-light); border-radius: 4px; padding: 10px 12px; margin-top: 10px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

@media (max-width: 720px) {
  #shell { flex-direction: column; }
  #sidebar { width: 100%; flex: none; flex-direction: row; overflow-x: auto; padding: 8px 0; align-items: center; }
  #sidebar .brand { padding: 0 12px; margin-bottom: 0; white-space: nowrap; }
  #sidebar .spacer { display: none; }
  .nav-item { white-space: nowrap; }
  #reset-household { border-top: none; border-left: 1px solid var(--border); margin: 0 12px; padding: 8px 12px; }
  #content { padding: 16px; }
}
</style>

// Mutable — an imported agency file (JSON, via file upload) can add to this.
let FOOD_PACKAGES = JSON.parse(JSON.stringify(DEFAULT_FOOD_PACKAGES));

const PREFERRED_REGION_ORDER = ["Southwest", "Great Plains", "Oklahoma", "Other"];

function getAgencyRegions() {
  const present = new Set(Object.values(FOOD_PACKAGES).map(p => p.region));
  const ordered = PREFERRED_REGION_ORDER.filter(r => present.has(r));
  const extra = [...present].filter(r => !PREFERRED_REGION_ORDER.includes(r)).sort();
  return [...ordered, ...extra];
}

function importAgencyPackages(raw) {
  // raw: parsed JSON, same shape as the desktop app's food_packages.json.
  // Unknown item names are dropped; malformed entries are skipped. Returns
  // the number of agencies actually imported.
  let count = 0;
  for (const [agencyName, entry] of Object.entries(raw || {})) {
    if (!entry || typeof entry !== "object" || !entry.items) continue;
    const items = {};
    for (const [itemName, qty] of Object.entries(entry.items)) {
      if (FOOD_ITEMS[itemName] && typeof qty === "number" && qty > 0) items[itemName] = qty;
    }
    if (Object.keys(items).length > 0) {
      FOOD_PACKAGES[agencyName] = {
        region: entry.region || "Other",
        sourceNote: entry.sourceNote || `Loaded from an imported file.`,
        items,
      };
      count++;
    }
  }
  return count;
}

const DAILY_SODIUM_GUIDELINE_MG = 2300;
const DAILY_ADDED_SUGAR_GUIDELINE_G = 50;
const DAYS_PER_MONTH = 30;
const WEEKS_PER_MONTH = DAYS_PER_MONTH / 7;

const EXPENSE_CATEGORIES = ["Housing (rent/mortgage)", "Utilities", "Transportation",
                            "Travel to distribution site", "Other essentials"];

const GAS_PRICE_PER_GALLON = 4.06; // U.S. DOT/BTS national average, August 2026
const ASSUMED_MPG = 25;

function estimateMonthlyGasCost(roundTripMiles, tripsPerMonth) {
  return tripsPerMonth * (roundTripMiles / ASSUMED_MPG) * GAS_PRICE_PER_GALLON;
}

// 2026 HHS poverty guidelines, 48 contiguous states: $15,960 base + $5,680
// per additional person. USDA NSLP: free meals at 130% of this, reduced at 185%.
const FPL_BASE_1PERSON_ANNUAL = 15960;
const FPL_INCREMENT_PER_PERSON_ANNUAL = 5680;
const NSLP_FREE_MULTIPLIER = 1.30;
const NSLP_REDUCED_MULTIPLIER = 1.85;

function nslpIncomeThresholdsMonthly(householdSize) {
  const annualFpl = FPL_BASE_1PERSON_ANNUAL + FPL_INCREMENT_PER_PERSON_ANNUAL * (householdSize - 1);
  return {
    free: (annualFpl * NSLP_FREE_MULTIPLIER) / 12,
    reduced: (annualFpl * NSLP_REDUCED_MULTIPLIER) / 12,
  };
}

function computeRecipeTotals(recipe) {
  let cost = 0, kcal = 0, protein = 0, carbs = 0, fat = 0;
  for (const [itemName, servingsUsed] of recipe.ingredients) {
    const info = FOOD_ITEMS[itemName];
    cost += servingsUsed * costPerServing(itemName);
    kcal += servingsUsed * info.kcal;
    protein += servingsUsed * info.protein;
    carbs += servingsUsed * info.carbs;
    fat += servingsUsed * info.fat;
  }
  return { cost, kcal, protein, carbs, fat };
}

function recipePerServing(totals, servings) {
  return { cost: totals.cost / servings, kcal: totals.kcal / servings,
           protein: totals.protein / servings, carbs: totals.carbs / servings, fat: totals.fat / servings };
}

function missingIngredients(recipe, agencyKey) {
  const pkg = FOOD_PACKAGES[agencyKey];
  if (!pkg) return [];
  return recipe.ingredients.filter(([name]) => !(name in pkg.items)).map(([name]) => name);
}

function recipeFitsPackage(recipe, agencyKey) {
  // Allows one missing ingredient — a single substitution, not a reason to
  // hide the recipe. A perfect-match requirement zeroed out every recipe
  // for at least one real package that was only missing a couple of items.
  return missingIngredients(recipe, agencyKey).length <= 1;
}

// --- Calculation layer -------------------------------------------------------

function scaleFactor(householdSize) {
  return Math.max(householdSize, 1) / 4.0;
}

function totalsForPackage(agencyKey, householdSize) {
  const pkg = FOOD_PACKAGES[agencyKey];
  const factor = scaleFactor(householdSize);
  let totalKcal = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0;
  let totalSodium = 0, totalSugar = 0, totalCost = 0, produceKcal = 0;
  const lines = [];

  for (const [itemName, monthlyQty] of Object.entries(pkg.items)) {
    const info = FOOD_ITEMS[itemName];
    const scaledQty = monthlyQty * factor;
    const servingsTotal = scaledQty * info.servingsPerUnit;

    const kcal = info.kcal * servingsTotal;
    const protein = info.protein * servingsTotal;
    const carbs = info.carbs * servingsTotal;
    const fat = info.fat * servingsTotal;
    const sodium = info.sodium * servingsTotal;
    const sugar = info.sugar * servingsTotal;
    const cost = info.unitCost * scaledQty;

    totalKcal += kcal; totalProtein += protein; totalCarbs += carbs; totalFat += fat;
    totalSodium += sodium; totalSugar += sugar; totalCost += cost;
    if (info.category === "produce") produceKcal += kcal;

    lines.push({
      item: itemName, qty: Math.round(scaledQty * 10) / 10, unit: info.unit,
      servingsTotal: Math.round(servingsTotal * 10) / 10,
      kcalTotal: Math.round(kcal), proteinTotal: Math.round(protein),
      carbsTotal: Math.round(carbs), fatTotal: Math.round(fat), costTotal: Math.round(cost * 100) / 100,
      perServingKcal: info.kcal, perServingProtein: info.protein, perServingCarbs: info.carbs, perServingFat: info.fat,
    });
  }

  return {
    kcal: totalKcal, protein: totalProtein, carbs: totalCarbs, fat: totalFat,
    sodium: totalSodium, sugar: totalSugar,
    produceSharePct: totalKcal ? (produceKcal / totalKcal) * 100 : 0,
    totalCost: Math.round(totalCost * 100) / 100,
    lines,
  };
}

function perDay(monthlyTotal) { return monthlyTotal / DAYS_PER_MONTH; }
function perWeek(monthlyTotal) { return monthlyTotal / WEEKS_PER_MONTH; }

// frequency: "monthly" | "yearly" | "lump"
function normalizeIncomeToMonthly(amount, frequency, lumpMonthsCovered) {
  if (frequency === "yearly") return amount / 12;
  if (frequency === "lump") return amount / Math.max(1, lumpMonthsCovered || 1);
  return amount;
}

function computeBudget(monthlyIncome, expenses, programValue) {
  const totalExpenses = Object.values(expenses).reduce((a, b) => a + b, 0);
  const leftover = monthlyIncome - totalExpenses;
  return {
    monthlyIncome, totalExpenses, programValue,
    leftoverCash: leftover, weeklyLeftoverCash: leftover / WEEKS_PER_MONTH,
    isShortfall: leftover < 0,
  };
}

const ZIP_COORDINATES = {
  "86515": [35.68, -109.05], "87301": [35.53, -108.74], "57770": [43.02, -102.55],
  "57701": [44.08, -103.23], "53703": [43.07, -89.38], "60601": [41.88, -87.63],
  "74701": [33.99, -96.37], "74464": [35.92, -94.97], "74820": [34.77, -96.68],
  "74447": [35.62, -95.96], "73102": [35.47, -97.52], "74103": [36.15, -95.99],
  "73501": [34.60, -98.40], "74501": [34.93, -95.77],
};

function haversineMiles(lat1, lon1, lat2, lon2) {
  const r = 3958.8;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return r * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function findNearestSites(zipCode) {
  const coords = ZIP_COORDINATES[zipCode.trim()];
  if (!coords) return null;
  const [lat, lon] = coords;
  return FDPIR_SITES.map(site => ({ site, distance: haversineMiles(lat, lon, site.lat, site.lon) }))
    .sort((a, b) => a.distance - b.distance);
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k === "for") e.setAttribute("for", v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}
function clear(container) { while (container.firstChild) container.removeChild(container.firstChild); }
function fmt0(n) { return Math.round(n).toLocaleString(); }

function applyUrlParams() {
  const params = new URLSearchParams(location.search);

  const program = params.get("program");
  if (program === "FDPIR" || program === "SNAP") state.program = program;
  const agency = params.get("agency");
  if (agency && FOOD_PACKAGES[agency]) state.agencyKey = agency;

  // Deliberately never includes income or expenses — only the household
  // setup, which is what's actually useful to bookmark or hand to someone
  // else (a caseworker suggesting "start from this agency"), never the
  // financial details.
  const params = new URLSearchParams();
  params.set("household", state.householdSize);
  if (state.program) params.set("program", state.program);
  if (state.program === "FDPIR") params.set("agency", state.agencyKey);

  url.search = params.toString();
  url.hash = "finances";
  return url.toString();
}

async function copyTextToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

  const monthsInput = el("input", { type: "number", min: "1", max: "12", value: months, style: "width:70px;" });

  monthsRow.appendChild(monthsLabel);
  monthsRow.appendChild(monthsInput);
  monthsRow.appendChild(el("div", { class: "small", style: "margin-top:6px;" },
    "This spreads a lump payment (a per-capita distribution, seasonal work) evenly across the months it needs " +
    "to cover — a flat monthly average hides the real risk of running out before the next payment."));
  container.appendChild(monthsRow);

  function updateMonthsVisibility() { monthsRow.style.display = frequency === "lump" ? "" : "none"; }
  updateMonthsVisibility();

  return { getAmount: () => amount, getFrequency: () => frequency, getMonths: () => months };
}

function summaryCard(label, value, sub, warn = false) {
  return el("div", { class: "summary-card" }, [
    el("div", { class: "label" }, label),
    el("div", { class: "value" + (warn ? " warn" : "") }, value),
    el("div", { class: "sub" }, sub),
  ]);
}

function buildFdpirSummary(container) {
  const totals = totalsForPackage(state.agencyKey, state.householdSize);
  const cardsRow = el("div", { class: "summary-cards" });
  cardsRow.appendChild(summaryCard("Total grocery value", `$${fmt0(totals.totalCost)}/mo`,
    `~$${fmt0(perWeek(totals.totalCost))}/week for a household of ${state.householdSize}`));
  cardsRow.appendChild(summaryCard("Daily calories & protein", `${fmt0(perDay(totals.kcal))} kcal`,
    `${fmt0(perDay(totals.protein))}g protein/day`));
  cardsRow.appendChild(summaryCard("Daily carbs & fat", `${fmt0(perDay(totals.carbs))}g / ${fmt0(perDay(totals.fat))}g`,
    `carbs / fat per day · ${fmt0(totals.produceSharePct)}% of calories from produce`));
  const sodiumLimit = DAILY_SODIUM_GUIDELINE_MG * state.householdSize;
  const sugarLimit = DAILY_ADDED_SUGAR_GUIDELINE_G * state.householdSize;
  const dailySodium = perDay(totals.sodium), dailySugar = perDay(totals.sugar);
  const warnFlag = dailySodium > sodiumLimit || dailySugar > sugarLimit;
  cardsRow.appendChild(summaryCard("Sodium & added sugar", `${fmt0(dailySodium)}mg / ${fmt0(dailySugar)}g`,
    `sodium (${dailySodium > sodiumLimit ? "above general guideline" : "within guideline"}), ` +
    `sugar (${dailySugar > sugarLimit ? "above general guideline" : "within guideline"})`, warnFlag));
  container.appendChild(cardsRow);

  const tableCard = el("div", { class: "card" });
  tableCard.appendChild(el("h2", {}, `${state.agencyKey} — this month's package, scaled to your household`));
  const wrapDiv = el("div", { class: "table-wrap" });
  const table = el("table", { class: "fdpir-table" });
  const headRow = el("tr");
  ["Food item", "Quantity", "Unit type", "Servings", "Per serving", "Total cost"].forEach((h, i) => {
    headRow.appendChild(el("th", { class: (i === 0 || i === 4) ? "left" : "" }, h));
  });
  table.appendChild(headRow);
  [...totals.lines].sort((a, b) => b.kcalTotal - a.kcalTotal).forEach(line => {
    const macros = `${line.perServingKcal} kcal · ${line.perServingProtein}g P · ${line.perServingCarbs}g C · ${line.perServingFat}g F`;
    const tr = el("tr", {}, [
      el("td", { class: "left" }, line.item), el("td", {}, String(line.qty)), el("td", {}, line.unit),
      el("td", {}, String(line.servingsTotal)), el("td", { class: "left" }, macros), el("td", {}, `$${fmt2(line.costTotal)}`),
    ]);
    table.appendChild(tr);
  });
  wrapDiv.appendChild(table);
  tableCard.appendChild(wrapDiv);
  tableCard.appendChild(el("div", { class: "small", style: "margin-top:8px;" },
    "Quantity = how many of that unit; Unit type = what one unit is (e.g. a 12oz can)."));
  tableCard.appendChild(el("div", { class: "small", style: "margin-top:4px;" }, FOOD_PACKAGES[state.agencyKey].sourceNote));
  container.appendChild(tableCard);
  return totals.totalCost;
}

function buildSnapSummary(container) {

function buildFinancesSection(container, programValue) {
  const card = el("div", { class: "card" });
  card.appendChild(el("h2", {}, "Finances"));
  const monthlyIncome = normalizeIncomeToMonthly(state.salaryAmount, state.salaryFrequency, state.lumpMonthsCovered);
  card.appendChild(el("div", { style: "margin:4px 0 12px 0;" }, `Monthly take-home pay: $${fmt0(monthlyIncome)}`));
  if (state.salaryFrequency === "lump") {
    card.appendChild(el("div", { class: "small", style: "margin-bottom:12px;max-width:600px;" },
      `Based on a $${fmt0(state.salaryAmount)} lump sum spread over ${state.lumpMonthsCovered} month(s). Make ` +
      `sure essential bills are covered every month, not just right after it arrives.`));
  }
  card.appendChild(el("div", { style: "font-weight:700;" }, "Essential monthly expenses"));
  if (state.sharedGasCost) {
    card.appendChild(el("div", { class: "small", style: "margin:4px 0 8px 0;" },
      `Travel to distribution site is pre-filled at $${fmt0(state.sharedGasCost)}/mo from the Locator page — edit it if that's not right.`));
  }
  const expenseInputs = {};
  EXPENSE_CATEGORIES.forEach(cat => {
    const row = el("div", { style: "margin:6px 0;display:flex;align-items:center;gap:10px;" });
    row.appendChild(el("span", { style: "width:220px;display:inline-block;" }, cat));
    let existing = state.expenses[cat] || 0;
    if (!existing && cat === "Travel to distribution site" && state.sharedGasCost) existing = state.sharedGasCost;
    const input = el("input", { type: "number", min: "0", value: existing || "" });
    row.appendChild(input);
    expenseInputs[cat] = input;
    card.appendChild(row);
  });

  const resultsArea = el("div", { style: "margin-top:14px;" });
  card.appendChild(resultsArea);

  const calcBtn = el("button", { class: "btn btn-accent", style: "margin-top:16px;" }, "Calculate Budget");
  calcBtn.addEventListener("click", () => {
    const expenses = {};
    for (const [cat, input] of Object.entries(expenseInputs)) {
      const val = parseFloat(input.value) || 0;
      if (val < 0) { alert(`Enter a number of 0 or more for ${cat}.`); return; }
      expenses[cat] = val;
    }
    state.expenses = expenses;
    const budget = computeBudget(monthlyIncome, expenses, programValue);
    state.lastBudget = budget;
    clear(resultsArea);
    const row = el("div", { class: "summary-cards" });
    row.appendChild(summaryCard("Cash left after bills", `$${fmt0(budget.leftoverCash)}/mo`,
      `~$${fmt0(budget.weeklyLeftoverCash)}/week`, budget.isShortfall));
    row.appendChild(summaryCard("Food benefit (separate from cash)", `$${fmt0(budget.programValue)}/mo`,
      "Covers groceries — not spendable cash"));
    resultsArea.appendChild(row);
    if (budget.isShortfall) {
      resultsArea.appendChild(el("div", { style: "color:var(--warn);margin-top:10px;max-width:600px;" },
        "Essential expenses are estimated to exceed take-home pay this month. Consider reviewing which " +
        "expenses are flexible, or contacting a local assistance office for support beyond food."));
    }
    const saveRow = el("div", { style: "margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;" });
    const saveBtn = el("button", { class: "btn-outline" }, "Save Summary as Text File");
    saveBtn.addEventListener("click", () => saveSummary(monthlyIncome, expenses, budget));
    saveRow.appendChild(saveBtn);

    const copyBtn = el("button", { class: "btn-outline" }, "Copy Summary");
    copyBtn.addEventListener("click", async () => {
      const ok = await copyTextToClipboard(buildBudgetSummaryText(monthlyIncome, expenses, budget));
      copyBtn.textContent = ok ? "Copied!" : "Couldn't copy";
      setTimeout(() => { copyBtn.textContent = "Copy Summary"; }, 2000);
    });
    saveRow.appendChild(copyBtn);

    const printBtn = el("button", { class: "btn-outline" }, "Print Summary");
    printBtn.addEventListener("click", () => printSummary(monthlyIncome, expenses, budget));
    saveRow.appendChild(printBtn);

    resultsArea.appendChild(saveRow);
  });
  card.appendChild(calcBtn);
  container.appendChild(card);
}

function buildSchoolMealsSection(container) {

/* ===================== CALCULATOR ===================== */
function renderCalculator() {
  const root = document.getElementById("page-calculator");
  clear(root);
  root.appendChild(el("h1", {}, "Calculator"));
  const stepNames = { 1: "Household size", 2: "FDPIR or SNAP", 3: "Salary", 4: "Results & finances" };
  root.appendChild(el("div", { class: "step-label" }, `Step ${calcStep} of ${CALC_TOTAL_STEPS}: ${stepNames[calcStep]}`));
  const track = el("div", { class: "progress-track" });
  track.appendChild(el("div", { class: "progress-fill", style: `width:${(calcStep / CALC_TOTAL_STEPS) * 100}%` }));
  root.appendChild(track);
  const area = el("div", { style: "margin-top:16px;" });
  root.appendChild(area);
  if (calcStep === 1) buildCalcStep1(area);
  else if (calcStep === 2) buildCalcStep2(area);
  else if (calcStep === 3) buildCalcStep3(area);
  else if (calcStep === 4) buildCalcResults(area);
}

function navButtons(container, onContinue, label = "Continue") {
  const row = el("div", { style: "margin-top:16px;" });
  if (calcStep > 1) {
    row.appendChild(el("button", { class: "btn-outline", style: "margin-right:10px;", type: "button",
      onclick: () => { calcStep--; renderCalculator(); } }, "← Back"));
  }
  row.appendChild(el("button", { class: "btn btn-accent", type: "button", onclick: onContinue }, label));
  container.appendChild(row);
}

function buildCalcStep1(area) {
  const card = el("div", { class: "card" });
  card.appendChild(el("div", { style: "font-weight:700;" }, "How many people are in your household?"));
  const input = el("input", { type: "number", min: "1", max: "12", value: state.householdSize, style: "margin-top:10px;width:80px;" });
  card.appendChild(input);
  area.appendChild(card);
  navButtons(card, () => {
    const val = parseInt(input.value, 10);
    if (!val || val < 1) { alert("Household size must be a whole number of 1 or more."); return; }
    state.householdSize = val;
    calcStep = 2;
    renderCalculator();
  });
}

function buildCalcStep2(area) {
  const card = el("div", { class: "card" });
  card.appendChild(el("div", { style: "font-weight:700;" }, "Which food program applies to your household?"));
  card.appendChild(el("div", { class: "small", style: "margin:4px 0 6px 0;max-width:600px;" },
    "A household is enrolled in FDPIR or SNAP, not both — pick whichever one currently applies."));
  const picker = buildProgramPicker(card);
  area.appendChild(card);
  navButtons(card, () => {
    const program = picker.getProgram();
    if (program !== "FDPIR" && program !== "SNAP") { alert("Select FDPIR or SNAP to continue."); return; }
    if (program === "SNAP") {
      const bal = picker.getSnapBalance();
      if (bal < 0) { alert("Enter a SNAP balance of 0 or more."); return; }
      state.snapBalance = bal;
    } else {
      state.agencyKey = picker.getAgencyKey();
    }
    state.program = program;
    calcStep = 3;
    renderCalculator();
  });
}

function buildCalcStep3(area) {
  const card = el("div", { class: "card", dataset: {} });
  card.dataset.groupId = "calc";
  card.appendChild(el("div", { style: "font-weight:700;" }, "What does your household bring home?"));
  card.appendChild(el("div", { class: "small", style: "margin:4px 0 12px 0;max-width:600px;" },
    "Use take-home pay (after taxes), not gross salary — used only for the budget in the next step and never leaves this tab."));
  const income = buildIncomeInput(card);
  const schoolLabel = el("label", { style: "display:block;margin-top:20px;font-weight:600;" });
  const schoolCheckbox = el("input", { type: "checkbox" });
  schoolCheckbox.checked = state.hasSchoolAgeChildren;
  schoolLabel.appendChild(schoolCheckbox);
  schoolLabel.appendChild(document.createTextNode(" We have school-age children (K-12) in the household"));
  card.appendChild(schoolLabel);
  area.appendChild(card);
  navButtons(card, () => {
    const amount = income.getAmount();
    if (amount < 0) { alert("Enter take-home pay as a number of 0 or more."); return; }
    state.salaryAmount = amount;
    state.salaryFrequency = income.getFrequency();
    state.lumpMonthsCovered = income.getMonths();
    state.hasSchoolAgeChildren = schoolCheckbox.checked;
    calcStep = 4;
    renderCalculator();
  }, "Calculate");
}

function buildCalcResults(area) {
  const programValue = state.program === "FDPIR" ? buildFdpirSummary(area) : buildSnapSummary(area);
  buildFinancesSection(area, programValue);
  if (state.hasSchoolAgeChildren) buildSchoolMealsSection(area);

  const row = el("div", { style: "margin-top:6px;" });
  row.appendChild(el("button", { class: "btn-outline", style: "margin-right:10px;", type: "button",
    onclick: () => { calcStep = 3; renderCalculator(); } }, "← Back"));
  row.appendChild(el("button", { class: "btn-outline", type: "button", onclick: () => {
    Object.assign(state, {
      householdSize: 4, program: null, agencyKey: Object.keys(FOOD_PACKAGES)[0], snapBalance: 0,
      salaryAmount: 0, salaryFrequency: "monthly", lumpMonthsCovered: 6, expenses: {}, hasSchoolAgeChildren: false,
    });
    calcStep = 1;
    renderCalculator();
  } }, "Start Over"));
  area.appendChild(row);
}

function renderRecipes() {
  const root = document.getElementById("page-recipes");
  clear(root);
  root.appendChild(el("h1", {}, "Recipes"));
  root.appendChild(el("div", { class: "small" }, "Built from common FDPIR food items — cost and nutrition are estimates."));

  const selectedPackage = state.program === "FDPIR" ? state.agencyKey : null;
  if (selectedPackage) {
    const label = el("label", { style: "display:block;margin-top:10px;font-weight:600;" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = recipeFilters.fitOnly;
    cb.addEventListener("change", () => { recipeFilters.fitOnly = cb.checked; renderRecipeGrid(); });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(" Only show recipes that fit my selected FDPIR package"));
    root.appendChild(label);
  }

  if (ALL_DIETARY_TAGS.length) {
    const row = el("div", { style: "margin-top:12px;" });
    row.appendChild(el("span", { class: "small", style: "margin-right:6px;" }, "Dietary preference:"));
    ALL_DIETARY_TAGS.forEach(tag => {
      const chip = el("span", { class: "chip chip-toggle" + (recipeFilters.tags.has(tag) ? " active-tag" : "") }, tag);
      chip.addEventListener("click", () => {
        if (recipeFilters.tags.has(tag)) recipeFilters.tags.delete(tag); else recipeFilters.tags.add(tag);
        renderRecipes();
      });
      row.appendChild(chip);
    });
    root.appendChild(row);
  }
  if (ALL_ALLERGENS.length) {
    const row2 = el("div", { style: "margin-top:6px;" });
    row2.appendChild(el("span", { class: "small", style: "margin-right:6px;" }, "Avoid:"));
    ALL_ALLERGENS.forEach(tag => {
      const chip = el("span", { class: "chip chip-toggle" + (recipeFilters.excludeAllergens.has(tag) ? " active-allergen" : "") }, tag);
      chip.addEventListener("click", () => {
        if (recipeFilters.excludeAllergens.has(tag)) recipeFilters.excludeAllergens.delete(tag);
        else recipeFilters.excludeAllergens.add(tag);
        renderRecipes();
      });
      row2.appendChild(chip);
    });
    root.appendChild(row2);
  }

  const grid = el("div", { id: "recipe-grid" });
  root.appendChild(grid);
  renderRecipeGrid();
}

function renderRecipeGrid() {
  const grid = document.getElementById("recipe-grid");
  if (!grid) return;
  clear(grid);
  const selectedPackage = state.program === "FDPIR" ? state.agencyKey : null;
  let list = RECIPES;
  if (selectedPackage && recipeFilters.fitOnly) list = list.filter(r => recipeFitsPackage(r, selectedPackage));
  if (recipeFilters.tags.size) list = list.filter(r => [...recipeFilters.tags].every(t => r.bestFor.includes(t)));
  if (recipeFilters.excludeAllergens.size) list = list.filter(r => !r.allergens.some(a => recipeFilters.excludeAllergens.has(a)));

  if (!list.length) {
    grid.appendChild(el("div", { class: "muted" }, "No recipes match the current filters."));
    const clearBtn = el("button", { class: "btn btn-accent", style: "margin-top:10px;" }, "Clear all filters");
    clearBtn.addEventListener("click", () => {
      recipeFilters = { fitOnly: false, tags: new Set(), excludeAllergens: new Set() };
      renderRecipes();
    });
    grid.appendChild(clearBtn);
    return;
  }

  const colors = ["#5b6b3a", "#8a5a3b", "#3b6b78", "#7a4f6b"];
  list.forEach((recipe, i) => {
    const totals = computeRecipeTotals(recipe);
    const ps = recipePerServing(totals, recipe.yields);
    const card = el("div", { class: "recipe-card" });
    card.appendChild(el("div", { class: "stripe", style: `background:${colors[i % colors.length]}` }));
    const body = el("div", { class: "rc-body" });
    body.appendChild(el("h3", {}, recipe.name));
    body.appendChild(el("div", { class: "rc-desc" }, recipe.description));
    body.appendChild(el("div", { class: "rc-stats" },
      `~$${fmt2(ps.cost)}/serving · ${fmt0(ps.kcal)} kcal · ${fmt0(ps.protein)}g protein · serves ${recipe.yields}`));
    if (selectedPackage) {
      const missing = missingIngredients(recipe, selectedPackage);
      if (missing.length) body.appendChild(el("div", { class: "rc-missing" },
        `Missing from your package: ${missing.join(", ")} — substitute if needed.`));
    }
    const chipRow = el("div", { style: "margin-bottom:8px;" });
    recipe.bestFor.forEach(t => chipRow.appendChild(el("span", { class: "chip", style: "background:var(--accent);" }, t)));
    recipe.allergens.forEach(t => chipRow.appendChild(el("span", { class: "chip", style: "background:var(--warn);" }, "Contains " + t)));
    body.appendChild(chipRow);
    const viewBtn = el("button", { class: "btn-outline", style: "margin-top:auto;align-self:flex-start;" }, "View recipe");
    viewBtn.addEventListener("click", () => openRecipeModal(recipe, selectedPackage));
    body.appendChild(viewBtn);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

function openRecipeModal(recipe, selectedPackage) {
  const totals = computeRecipeTotals(recipe);
  const ps = recipePerServing(totals, recipe.yields);
  const missing = selectedPackage ? missingIngredients(recipe, selectedPackage) : [];

  const backdrop = el("div", { id: "modal-backdrop" });
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });
  const modal = el("div", { id: "modal" });
  const closeBtn = el("button", { class: "modal-close", type: "button" }, "×");
  closeBtn.addEventListener("click", () => backdrop.remove());
  modal.appendChild(closeBtn);
  modal.appendChild(el("h2", { style: "margin-top:0;" }, recipe.name));
  modal.appendChild(el("p", { class: "muted" }, recipe.description));
  if (missing.length) {
    modal.appendChild(el("div", { style: "color:var(--warn);margin-bottom:10px;" },
      `Missing from your selected package: ${missing.join(", ")}. Everything else below is in your package — ` +
      `swap in what you have for the missing item(s).`));
  }
  const chipRow = el("div", { style: "margin-bottom:10px;" });
  recipe.bestFor.forEach(t => chipRow.appendChild(el("span", { class: "chip", style: "background:var(--accent);" }, t)));
  recipe.allergens.forEach(t => chipRow.appendChild(el("span", { class: "chip", style: "background:var(--warn);" }, "Contains " + t)));
  modal.appendChild(chipRow);

  const statsCard = el("div", { class: "card" });
  statsCard.appendChild(el("div", { style: "font-weight:700;" }, `Serves ${recipe.yields}`));
  statsCard.appendChild(el("div", {}, `$${fmt2(ps.cost)} per serving ($${fmt2(totals.cost)} total)`));
  statsCard.appendChild(el("div", {}, `${fmt0(ps.kcal)} kcal · ${fmt0(ps.protein)}g protein · ${fmt0(ps.carbs)}g carbs · ${fmt0(ps.fat)}g fat — per serving`));
  modal.appendChild(statsCard);

  modal.appendChild(el("div", { style: "font-weight:700;margin-top:10px;" }, "Ingredients"));
  recipe.ingredients.forEach(([name, servings]) => {
    modal.appendChild(el("div", {}, `• ${servings} serving(s) of ${name}`));
  });
  modal.appendChild(el("div", { style: "font-weight:700;margin-top:14px;" }, "Steps"));
  recipe.steps.forEach((step, i) => {
    modal.appendChild(el("div", { style: "margin-bottom:6px;" }, `${i + 1}. ${step}`));
  });

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
}

function renderLocatorResults(container) {
  clear(container);
  if (locatorLastResults === null) {
    if (locatorLastZip) container.appendChild(el("div", { style: "color:var(--warn);" },
      `"${locatorLastZip}" isn't in this demo's small ZIP sample. Try one of the ZIP codes listed above.`));
    return;
  }
  locatorLastResults.forEach(({ site, distance }, i) => {
    const card = el("div", { class: "site-card" });
    card.appendChild(el("div", { style: "font-weight:700;color:var(--accent-dark);" }, `#${i + 1} · ${site.agency}`));
    card.appendChild(el("div", {}, `~${fmt0(distance)} miles (straight-line estimate)`));
    card.appendChild(el("div", { style: "margin-top:4px;" }, site.address));
    card.appendChild(el("div", { class: "small", style: "margin:2px 0 8px 0;" }, `${site.phone} · ${site.hours}`));

    const actionsRow = el("div", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap;" });
    const useBtn = el("button", { class: "ghost-btn", style: "border:1px solid var(--border);" }, "Use as my FDPIR agency");
    const statusLbl = el("span", { class: "small", style: "color:var(--accent-dark);" });
    useBtn.addEventListener("click", () => {
      state.program = "FDPIR";
      state.agencyKey = site.agency;
      statusLbl.textContent = "Set as your FDPIR agency — the Calculator and Finances pages will use it.";
    });
    actionsRow.appendChild(useBtn);
    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${site.lat},${site.lon}`;
    actionsRow.appendChild(el("a", { href: mapsUrl, target: "_blank", rel: "noopener",
      class: "ghost-btn", style: "border:1px solid var(--border);text-decoration:none;display:inline-block;" }, "Open in Maps"));
    card.appendChild(actionsRow);
    card.appendChild(statusLbl);

    if (i === 0) {
      const gasBox = el("div", { class: "gas-box" });
      gasBox.appendChild(el("div", { style: "font-weight:700;color:var(--accent-dark);" }, "Estimate the gas cost of getting here"));
      gasBox.appendChild(el("div", { class: "small", style: "margin:2px 0 8px 0;" },
        `Assumes ~${ASSUMED_MPG} mpg at $${GAS_PRICE_PER_GALLON.toFixed(2)}/gallon (U.S. DOT national average, August 2026).`));
      const tripRow = el("div", {});
      tripRow.appendChild(el("span", {}, "Trips per month: "));
      const tripsInput = el("input", { type: "number", min: "0", value: "1", style: "width:60px;margin-right:10px;" });
      tripRow.appendChild(tripsInput);
      const addBtn = el("button", { class: "btn btn-accent" }, "Add to my budget");
      tripRow.appendChild(addBtn);
      gasBox.appendChild(tripRow);
      const resultLbl = el("div", { style: "font-weight:700;color:var(--accent-dark);margin-top:8px;" });
      gasBox.appendChild(resultLbl);
      addBtn.addEventListener("click", () => {
        const trips = parseFloat(tripsInput.value) || 0;
        if (trips < 0) { alert("Enter a number of 0 or more."); return; }
        const monthlyCost = estimateMonthlyGasCost(distance * 2, trips);
        state.sharedGasCost = monthlyCost;
        resultLbl.textContent = `≈ $${fmt0(monthlyCost)}/month — added to the Calculator's Finances step as ` +
          `"Travel to distribution site" (edit it there if you'd like).`;
      });
      card.appendChild(gasBox);
    }
    container.appendChild(card);
  });
}

  ["What is FDPIR?", "The Food Distribution Program on Indian Reservations (FDPIR) provides USDA foods each month to income-eligible households living on a reservation, and to Native American households in approved areas near a reservation — or in Oklahoma. It's administered locally by a tribal organization or a state agency; foods offered change month to month.\nSource: USDA Food and Nutrition Service, fna.usda.gov/fdpir"],
  ["Oklahoma is a specific exception", "Most of Oklahoma has no formal Indian reservations in the way other states do, following historical allotment policy. USDA's FDPIR eligibility rules explicitly account for this: an income-eligible household in Oklahoma with at least one member of a federally recognized tribe can qualify without living on a reservation at all — unlike most other states, where reservation residency (or a nearby approved area) is required.\nSource: USDA FNS FDPIR Factsheet (fna.usda.gov/fdpir/factsheet)"],
  ["What is SNAP?", "The Supplemental Nutrition Assistance Program (SNAP) provides a monthly dollar benefit, loaded onto a card, spent on groceries at participating stores. The amount depends on household size, income, and expenses."],
  ["Why can't I have both?", "A household can be certified for FDPIR or SNAP, but not both in the same month — a federal program rule. Households often choose based on access — FDPIR doesn't require a nearby SNAP-accepting grocery store, since the food is distributed directly."],

function renderAbout() {
  const root = document.getElementById("page-about");
  clear(root);
  root.appendChild(el("h1", {}, "About"));

  const importCard = el("div", { class: "card" });
  importCard.appendChild(el("div", { style: "font-weight:700;" }, "Import agency data"));
  importCard.appendChild(el("div", { class: "small", style: "margin:2px 0 10px 0;max-width:640px;" },
    "Have a real, current FDPIR food package list as JSON? Import it here to add or replace agencies for this " +
    "session — the same format the desktop version reads from a food_packages.json file."));
  const fileInput = el("input", { type: "file", accept: ".json" });
  const importStatus = el("div", { class: "small", style: "margin-top:8px;" });
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const raw = JSON.parse(reader.result);
        const count = importAgencyPackages(raw);
        importStatus.textContent = count > 0 ? `Imported ${count} agenc${count === 1 ? "y" : "ies"}.` : "No valid agencies found in that file.";
        importStatus.style.color = count > 0 ? "var(--accent-dark)" : "var(--warn)";
      } catch (e) {
        importStatus.textContent = "Couldn't parse that file as JSON.";
        importStatus.style.color = "var(--warn)";
      }
    };
    reader.readAsText(file);
  });
  importCard.appendChild(fileInput);
  importCard.appendChild(importStatus);
  root.appendChild(importCard);

  LEARN_SECTIONS.forEach(([heading, body]) => {
    const section = el("div", { style: "margin-bottom:18px;" });

  });
}

function buildBudgetSummaryText(monthlyIncome, expenses, budget) {
  const lines = [];
  lines.push("GroundTruth — Summary");
  lines.push(`Generated in-browser on ${new Date().toISOString().slice(0, 10)}. This file was not saved automatically —`);
  lines.push("it exists only because you chose to save it; the app itself keeps nothing on a server.");
  lines.push("");
  lines.push(`Household size: ${state.householdSize}`);
  let packageTotals = null;
  if (state.program === "FDPIR") {
    lines.push(`Program: FDPIR (${state.agencyKey})`);
    packageTotals = totalsForPackage(state.agencyKey, state.householdSize);
  } else if (state.program === "SNAP") {
    lines.push(`Program: SNAP ($${fmt0(state.snapBalance)}/month balance)`);
  }
  if (packageTotals) {
    lines.push("");
    lines.push(`FDPIR package details — ${state.agencyKey} (scaled to household of ${state.householdSize}):`);
    lines.push(`  Total grocery value: $${fmt0(packageTotals.totalCost)}/month (~$${fmt0(perWeek(packageTotals.totalCost))}/week)`);
    lines.push(`  Daily nutrition: ${fmt0(perDay(packageTotals.kcal))} kcal, ${fmt0(perDay(packageTotals.protein))}g protein, ${fmt0(perDay(packageTotals.carbs))}g carbs, ${fmt0(perDay(packageTotals.fat))}g fat`);
    lines.push(`  Sodium: ${fmt0(perDay(packageTotals.sodium))}mg/day; Added sugar: ${fmt0(perDay(packageTotals.sugar))}g/day; ${fmt0(packageTotals.produceSharePct)}% of calories from produce`);
    lines.push("  Item breakdown:");
    [...packageTotals.lines].sort((a, b) => b.kcalTotal - a.kcalTotal).forEach(line => {
      lines.push(`    - ${line.item}: ${line.qty} ${line.unit} (${line.servingsTotal} servings) — ${line.perServingKcal} kcal/${line.perServingProtein}g P/${line.perServingCarbs}g C/${line.perServingFat}g F per serving — $${fmt2(line.costTotal)} total`);
    });
  }
  lines.push("");
  lines.push(`Monthly take-home pay: $${fmt0(monthlyIncome)}`);
  lines.push("");
  lines.push("Essential monthly expenses:");
  Object.entries(expenses).forEach(([cat, amt]) => lines.push(`  - ${cat}: $${fmt0(amt)}`));
  lines.push("");
  lines.push(`Cash left after bills: $${fmt0(budget.leftoverCash)}/month (~$${fmt0(budget.weeklyLeftoverCash)}/week)`);
  lines.push(`Food benefit (separate from cash, covers groceries): $${fmt0(budget.programValue)}/month`);
  if (budget.isShortfall) {
    lines.push("");
    lines.push("NOTE: essential expenses are estimated to exceed take-home pay this month.");
  }
  if (state.hasSchoolAgeChildren) {
    lines.push("");
    if (state.program === "FDPIR" || state.program === "SNAP") {
      lines.push(`School meals: since this household is enrolled in ${state.program}, school-age children are automatically eligible for free school meals via direct certification (USDA FNS Policy Memo FD-045) — no separate income application is needed.`);
    }
    const thr = nslpIncomeThresholdsMonthly(state.householdSize);
    lines.push(`For reference, the 2026-2027 federal income guideline for a household of ${state.householdSize}: free meals at or below $${fmt0(thr.free)}/month, reduced-price at or below $${fmt0(thr.reduced)}/month.`);
  }
  lines.push("");
  lines.push("Figures in this app are planning estimates, not an official benefits determination.");
  lines.push("Confirm current program amounts and eligibility with your local administering agency.");
  return lines.join("\n");
}

function printSummary(monthlyIncome, expenses, budget) {
  const text = buildBudgetSummaryText(monthlyIncome, expenses, budget);
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const win = window.open("", "_blank");
  if (!win) { alert("Please allow pop-ups to print the summary."); return; }
  win.document.write(
    "<!DOCTYPE html><html><head><title>GroundTruth — Summary</title>" +
    "<style>body{font-family:Georgia,serif;white-space:pre-wrap;padding:36px;max-width:680px;" +
    "margin:0 auto;line-height:1.6;color:#252520;}</style></head><body>" + escaped + "</body></html>"
  );
  win.document.close();
  win.focus();
  win.print();
}

async function saveSummary(monthlyIncome, expenses, budget) {
  const text = buildBudgetSummaryText(monthlyIncome, expenses, budget);
  const filename = "food-navigator-summary.txt";
  try {
    const downloads = (window.claude && typeof window.claude.use === "function")
      ? await window.claude.use("downloads") : null;
    if (downloads) {
      await downloads.save({ filename, data: text });
      return;
    }
  } catch (e) {
    // declined / rate-limited / unavailable — fall through to a plain browser download
  }
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
